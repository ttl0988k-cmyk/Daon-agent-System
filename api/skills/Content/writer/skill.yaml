name: writer
category: Content
version: '1.0'
description: Orwell의 6가지 글쓰기 원칙을 적용한 텍스트 개선 가이드라인을 제공한다
priority: medium
capabilities:
- content_writing
- copywriting
knowledge:
- prompts
- examples
- data
- templates
trigger:
- write
- blog
- article
- 글쓰기
- 블로그
tags:
- writing
- editing
- clarity
- orwell
graph_compatible:
- auto-documenter
- self-reflection
when_to_use: 텍스트 개선, 문서 명확화, 에디팅, 간결화 작업 시
when_not_to_use: 코드 작성, UI 디자인, 보안 감사, 디버깅
inputs: 개선할 텍스트, 타겟 독자(General/Technical/Business)
outputs: 개선된 텍스트, 변경 사유 설명, 단어 수 감소량
constraints: 원본 의미 보존, 과도한 수정 금지, Orwell 6원칙을 균형 있게 적용
success_criteria: 단어 수 감소, 수동태→능동태 전환, 불필요한 전문용어 제거, 진부한 표현 제거
