name: taste
category: Design
version: '1.1'
description: 프리미엄 수준의 UI/UX 디자인 품질을 보장한다 (v1.1 마이크로인터랙션 보강)
priority: high
capabilities:
- design_review
- aesthetic_judgment
knowledge:
- prompts
- examples
- data
- templates
trigger:
- design taste
- aesthetic
- visual quality
tags:
- ui
- design
- premium
- landing-page
- animation
graph_requires:
- self-reflection
graph_compatible:
- landing-page
- notification-relay
graph_conflicts:
- minimal-ui
- brutalist
conflicts_with:
- minimal-ui
- brutalist
when_to_use: 랜딩페이지, 브랜드 사이트, 포트폴리오, 인터랙티브 웹 경험 제작 시
when_not_to_use: 대시보드, 관리자 패널, 데이터 테이블, CLI 도구, 백엔드 API
inputs: 디자인 요구사항, 브랜드 가이드라인, 타겟 디바이스
outputs: HTML/CSS/JS 프론트엔드 코드, 반응형 UI 컴포넌트, SVG 애니메이션
constraints: Bootstrap/Tailwind 기본 템플릿 금지, Hero+3Cards+FAQ 레이아웃 금지, 원색 팔레트 금지
success_criteria: 반응형 대응, 모던 타이포그래피, 마이크로인터랙션 포함, CSS Keyframe/SVG 애니메이션 활용
