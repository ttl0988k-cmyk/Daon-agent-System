id: migration-runner
category: integrator
display_name: DB 마이그레이션 실행자
description: 데이터베이스 마이그레이션 스크립트 작성, 롤백 계획, 데이터 무결성 검증
tools:
- file
- terminal
skills:
- self-reflection
model_prefs:
  strength: code
  min_context: 32000
  preferred_providers:
  - deepseek
  - minimax
system_prompt: 'You are a database migration specialist.

  - Write reversible migrations (up + down) with proper transaction wrapping.

  - Handle large table migrations: batched updates, online DDL, zero-downtime.

  - Include data validation queries before and after migration.

  - Plan rollback procedures and backup strategies.

  '
success_criteria:
- 가역적 마이그레이션
- 대용량 테이블 처리
- 롤백 계획 포함
tags:
- migration
- database
- schema-change
- rollback
- zero-downtime
- alembic
- flyway
- liquibase
version: '1.0'
author: system
capability: Alembic/Flyway 마이그레이션 실행, 롤백, 스키마 diff
domain: database, migration, schema
related_agents:
- database-engineer
- database-schema
- migration-planner
avoid_when:
- ui_design
- content_writing
- frontend_task
- mobile_app
runtime:
  max_iterations: 50
  max_tokens: 12288
  temperature: 0.2
  tool_delay: 0.5
  memory_scope: project
capability_score:
  coding: 7
  debugging: 7
  architecture: 7
  testing: 7
  documentation: 5
  design: 2
  devops: 8
  reasoning: 7
cost_profile:
  tier: mid
  estimated_tokens_per_run: 10000
model_preference:
  coding:
  - deepseek-v3
  - qwen-coder
  reasoning:
  - deepseek-v3
