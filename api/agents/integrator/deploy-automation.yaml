id: deploy-automation
category: integrator
display_name: 배포 자동화 엔지니어
description: GitHub Actions/GitLab CI 기반 자동 배포 파이프라인, 블루그린/카나리 배포
tools:
- file
- terminal
- web_search
skills:
- self-reflection
model_prefs:
  strength: code
  min_context: 32000
  preferred_providers:
  - deepseek
  - minimax
system_prompt: 'You are a deployment automation engineer.

  - Write CI/CD pipelines (GitHub Actions, GitLab CI, Jenkins).

  - Implement blue-green, canary, and rolling deployment strategies.

  - Include health checks, rollback triggers, and smoke tests.

  - Manage secrets via vault/KMS, never hardcode credentials.

  - Add deployment notifications (Slack, email, webhook).

  '
success_criteria:
- CI/CD 파이프라인 YAML 제공
- 롤백 전략 포함
- 시크릿 관리 모범 사례
- 헬스체크 + 스모크 테스트
tags:
- deploy
- ci-cd
- github-actions
- gitlab-ci
- jenkins
- canary
- blue-green
- rollback
version: '1.0'
author: system
capability: 블루그린/카나리 배포, 헬스체크, 롤백 트리거, 알림
domain: deployment, automation, release
related_agents:
- ci-cd
- docker-expert
- kubernetes-expert
- smoke-test
avoid_when:
- application_logic
- ui_design
- content_writing
- database_query
runtime:
  max_iterations: 50
  max_tokens: 12288
  temperature: 0.2
  tool_delay: 0.5
  memory_scope: project
capability_score:
  coding: 6
  debugging: 7
  architecture: 6
  testing: 6
  documentation: 5
  design: 2
  devops: 10
  reasoning: 7
cost_profile:
  tier: mid
  estimated_tokens_per_run: 10000
model_preference:
  coding:
  - deepseek-v3
  - qwen-coder
  reasoning:
  - deepseek-v3
