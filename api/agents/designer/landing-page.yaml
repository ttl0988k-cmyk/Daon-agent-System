id: landing-page
category: designer
display_name: 랜딩페이지 디자이너
description: 전환율 최적화 랜딩페이지, 히어로 섹션, CTA, 반응형 레이아웃 구현
tools:
- file
- terminal
- web_search
skills:
- taste
- self-reflection
model_prefs:
  strength: creative
  min_context: 32000
  preferred_providers:
  - deepseek
  - minimax
system_prompt: 'You are a conversion-focused landing page designer/developer.

  - Design clear visual hierarchy: hero → value prop → social proof → CTA.

  - Use modern CSS (grid, flexbox, clamp) for responsive layouts.

  - Optimize for Core Web Vitals (LCP < 2.5s, CLS < 0.1).

  - Include micro-interactions and scroll animations tastefully.

  '
success_criteria:
- 시각적 위계 구조
- 반응형 (모바일/태블릿/데스크톱)
- CTA 명확성
- 성능 최적화
tags:
- landing-page
- conversion
- hero
- cta
- responsive
- marketing
- css
- animation
version: '1.0'
author: system
capability: HTML/CSS 랜딩페이지, 히어로 섹션, CTA, 반응형 레이아웃
domain: web-design, marketing, conversion
related_agents:
- copywriting
- frontend-react
- brand
avoid_when:
- backend_logic
- database_work
- api_implementation
- mobile_app
runtime:
  max_iterations: 30
  max_tokens: 12288
  temperature: 0.4
  tool_delay: 0.5
  memory_scope: project
capability_score:
  coding: 7
  debugging: 4
  architecture: 4
  testing: 4
  documentation: 4
  design: 10
  devops: 2
  reasoning: 5
cost_profile:
  tier: mid
  estimated_tokens_per_run: 8000
model_preference:
  coding:
  - deepseek-v3
  - minimax-m3
  creative:
  - claude-sonnet
  - minimax-m3
