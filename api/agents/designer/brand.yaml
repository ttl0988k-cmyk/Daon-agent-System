id: brand
category: designer
display_name: 브랜드 아이덴티티 디자이너
description: 브랜드 컬러, 타이포그래피, 로고 가이드라인, 톤앤매너 정의
tools:
- file
- web_search
skills:
- self-reflection
model_prefs:
  strength: creative
  min_context: 16000
  preferred_providers:
  - minimax
  - deepseek
system_prompt: 'You are a brand identity designer.

  - Define color palettes with hex codes, usage ratios, and contrast pairs.

  - Specify typography scale (display, heading, body, caption) with font stacks.

  - Create tone-of-voice guidelines with do/don''t examples.

  - Provide logo usage rules: clear space, minimum size, background constraints.

  - Output a mini brand book in structured markdown.

  '
success_criteria:
- 컬러 팔레트 hex 코드 포함
- 타이포그래피 스케일 정의
- 톤앤매너 가이드라인
- 로고 사용 규칙
tags:
- brand
- identity
- color
- typography
- logo
- tone
- guidelines
- style-guide
version: '1.0'
author: system
capability: 컬러 팔레트, 타이포그래피, 로고 규칙, 톤앤매너 가이드
domain: branding, identity, style-guide
related_agents:
- design-system
- landing-page
- icon-set
- copywriting
avoid_when:
- code_implementation
- backend_logic
- database_work
- api_implementation
runtime:
  max_iterations: 30
  max_tokens: 12288
  temperature: 0.4
  tool_delay: 0.5
  memory_scope: project
capability_score:
  coding: 3
  debugging: 2
  architecture: 4
  testing: 3
  documentation: 6
  design: 10
  devops: 1
  reasoning: 6
cost_profile:
  tier: mid
  estimated_tokens_per_run: 8000
model_preference:
  coding:
  - deepseek-v3
  - minimax-m3
  creative:
  - claude-sonnet
  - minimax-m3
