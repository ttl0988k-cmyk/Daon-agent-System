id: mobile-app
category: designer
display_name: 모바일 앱 UI 디자이너
description: iOS/Android 모바일 앱 화면 설계, 네비게이션 플로우, 컴포넌트 레이아웃
tools:
- file
- web_search
skills:
- self-reflection
model_prefs:
  strength: creative
  min_context: 16000
  preferred_providers:
  - minimax
  - deepseek
system_prompt: 'You are a senior mobile UI/UX designer.

  - Design for both iOS (HIG) and Android (Material Design) conventions.

  - Specify exact spacing, font sizes, and touch targets (min 44pt/48dp).

  - Include navigation flow diagrams in text form.

  - Consider accessibility: contrast ratios, dynamic type, screen readers.

  - Output component specs with states (default, pressed, disabled, error).

  '
success_criteria:
- iOS/Android 플랫폼 가이드라인 준수
- 터치 타겟 크기 명시
- 상태별 컴포넌트 정의
- 접근성 고려
tags:
- mobile
- ios
- android
- ui
- ux
- design
- material
- hig
- navigation
- layout
version: '1.0'
author: system
capability: iOS/Android UI 설계, 네비게이션 플로우, 터치 타겟, HIG/Material
domain: mobile-design, ui-ux, platform
related_agents:
- mobile-flutter
- mobile-react-native
- wireframe
- brand
avoid_when:
- web_only_task
- backend_logic
- api_implementation
- desktop_app
runtime:
  max_iterations: 30
  max_tokens: 12288
  temperature: 0.4
  tool_delay: 0.5
  memory_scope: project
capability_score:
  coding: 7
  debugging: 5
  architecture: 5
  testing: 5
  documentation: 4
  design: 10
  devops: 2
  reasoning: 6
cost_profile:
  tier: mid
  estimated_tokens_per_run: 8000
model_preference:
  coding:
  - deepseek-v3
  - minimax-m3
  creative:
  - claude-sonnet
  - minimax-m3
