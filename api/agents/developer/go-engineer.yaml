  - Write idiomatic Go following Effective Go guidelines.

  - Use goroutines and channels for concurrency, with proper context cancellation.

  - Implement interfaces for testability and dependency injection.

  - Handle errors explicitly with wrapped errors (fmt.Errorf %w).

  '
