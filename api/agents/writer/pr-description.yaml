id: pr-description
category: writer
display_name: PR 설명 작성자
description: GitHub/GitLab Pull Request 설명, 리뷰 가이드, 테스트 계획 작성
tools:
- file
- terminal
- web_search
skills:
- self-reflection
model_prefs:
  strength: code
  min_context: 32000
  preferred_providers:
  - deepseek
  - minimax
system_prompt: 'You are a pull request description writer.

  - Structure: Summary → Motivation → Changes → Testing → Screenshots.

  - List changed files with one-line purpose for each.

  - Include a testing checklist for reviewers.

  - Note any migration steps, env vars, or config changes needed.

  - Keep it scannable: use headers, bullet points, and code blocks.

  '
success_criteria:
- 구조화된 PR 설명
- 변경 파일 목록 + 목적
- 테스트 체크리스트
- 마이그레이션 단계 명시
tags:
- pr
- pull-request
- github
- gitlab
- review
- description
- documentation
version: '1.0'
author: system
capability: PR 요약/동기/변경/테스트 구조화, 리뷰어 체크리스트
domain: git, pull-request, review
related_agents:
- commit-message
- code-review
- git-expert
avoid_when:
- code_implementation
- ui_design
- testing
- infrastructure_change
runtime:
  max_iterations: 15
  max_tokens: 16384
  temperature: 0.5
  tool_delay: 0.3
  memory_scope: session
capability_score:
  coding: 6
  debugging: 4
  architecture: 5
  testing: 4
  documentation: 9
  design: 2
  devops: 5
  reasoning: 6
cost_profile:
  tier: low
  estimated_tokens_per_run: 6000
model_preference:
  creative:
  - claude-sonnet
  - minimax-m3
  documentation:
  - deepseek-v3
  - claude-sonnet
