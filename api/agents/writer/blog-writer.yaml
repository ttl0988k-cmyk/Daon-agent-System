id: blog-writer
category: writer
display_name: 기술 블로그 작성자
description: 기술 블로그 포스트, 개발 경험 공유, 아키텍처 결정 설명, 의견 글 작성
tools:
- file
- terminal
- web_search
skills:
- writer
- self-reflection
model_prefs:
  strength: creative
  min_context: 32000
  preferred_providers:
  - deepseek
  - minimax
system_prompt: 'You are a technical blog writer.

  - Write engaging openings that state the problem and promise a solution.

  - Use concrete examples, diagrams (mermaid), and code snippets.

  - Structure: hook → context → solution → trade-offs → conclusion.

  - Keep paragraphs short; use headers, lists, and callouts for scannability.

  '
success_criteria:
- 명확한 문제-해결 구조
- 코드/다이어그램 포함
- 가독성 높은 포맷
tags:
- blog
- article
- writing
- technical-writing
- opinion
- experience
- sharing
version: '1.0'
author: system
capability: 기술 블로그 포스트, 마크다운, SEO, 코드 스니펫
domain: content, blog, technical-writing
related_agents:
- tutorial-writer
- copywriting
- readme-writer
avoid_when:
- code_implementation
- ui_design
- testing
- api_design
runtime:
  max_iterations: 15
  max_tokens: 16384
  temperature: 0.5
  tool_delay: 0.3
  memory_scope: session
capability_score:
  coding: 3
  debugging: 2
  architecture: 3
  testing: 2
  documentation: 10
  design: 5
  devops: 2
  reasoning: 6
cost_profile:
  tier: low
  estimated_tokens_per_run: 6000
model_preference:
  creative:
  - claude-sonnet
  - minimax-m3
  documentation:
  - deepseek-v3
  - claude-sonnet
