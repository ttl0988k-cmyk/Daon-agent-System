# StyleCard YAML Schema — Creative Director Reference Library 표준
# 이 스키마는 api/api/style_card.py 의 StyleCard / ComponentCard 데이터클래스와 1:1 대응.
# 라온이 새 카드를 생성할 때 이 스키마를 따라야 한다.
#
# 사용법:
#   1) 라이브러리에 새 카드를 추가할 때 이 스키마를 만족하는 YAML 작성
#   2) StyleCard.from_yaml(path) 으로 로드 → 검증 → 저장
#   3) StyleCard.evaluate() 로 점수 산정
#   4) StyleCard.decompose_to_components() 로 ComponentCard 분리
#
# 호환: style_card.py v2.0 (StyleCard + ComponentCard)

schema_version: "2.0"
schema_target: "api.api.style_card.StyleCard"
schema_yaml_loaded_by: "StyleCard.from_yaml(Path)"

# ── 최상위 식별자 ──
top_level_required:
  - id                # string, unique (예: "linear-dashboard-2026")
  - name              # string, 사람이 읽는 이름
  - source            # string, 출처 URL 또는 "internal:<design_name>"
  - category          # string, VALID_COMPONENT_CATEGORIES 중 하나
  - created           # string, ISO 8601

top_level_optional:
  - description       # string, 1~3 문장 요약
  - tags              # list[string], 검색/필터링 키워드
  - screenshot_url    # string (optional, Phase 3+ 시각 검색용)
  - decomposed_cards  # list[ComponentCard], 자동 분해 결과 (라온이 채움)
  - evaluation        # Evaluation, 평가 점수
  - guidelines        # Guidelines, DO/DON'T

# ── Design DNA ──
design_dna:
  description: "5가지 시각 시스템 (color / typography / layout / animation / spacing)"

  colors:
    required:
      - primary           # HEX, "#6366F1"
      - accent            # HEX
      - background        # HEX 또는 rgba()
      - surface           # HEX 또는 rgba()
      - text_primary      # HEX
      - text_secondary    # HEX
    optional:
      - palette_name      # 예: "Midnight Aurora"
      - palette_harmony   # complementary | analogous | triadic | monochromatic
    validation:
      primary_must_be_hex: true
      contrast_min_ratio: 4.5     # WCAG AA

  typography:
    required:
      - heading_font      # 예: "Inter", "Pretendard", "Noto Sans KR"
      - body_font
    optional:
      - mono_font
      - scale             # major-second | minor-second | major-third | perfect-fourth | minor-third
      - heading_weight    # 100~900
      - body_weight
      - letter_spacing_heading  # CSS 단위
      - line_height_body  # 1.0~2.5

  layout:
    required:
      - grid              # 12-column | bento | masonry | asymmetric | single-column | split
      - max_width         # CSS 단위
    optional:
      - padding_desktop
      - padding_mobile
      - alignment         # left | center | right
      - glass_effect      # bool
      - border_radius
      - backdrop_blur

  animation:
    optional:
      - entrance          # fade-up | scale-in | slide-left | reveal | stagger
      - hover
      - scroll
      - page_transition
      - duration_base
      - easing
      - motion_intensity  # 1~10, 8+ 시 prefers-reduced-motion 대응 필요
    validation:
      motion_intensity_max: 10
      reduced_motion_required_above: 8

  spacing:
    optional:
      - density           # compact | moderate | airy | luxurious
      - section_gap
      - element_gap

# ── Component Composition ──
composition:
  description: "이 디자인의 시각적 구성 순서"
  structure:
    type: list[string]
    example:
      - "split-hero (좌측 타이틀 + 우측 일러스트)"
      - "feature-grid (3-column, 아이콘 + 텍스트)"
      - "social-proof (고객 로고 그리드)"
      - "pricing-cards (3-tier)"
      - "footer-cta (이메일 수집)"

# ── DO / DON'T ──
guidelines:
  do:
    type: list[string]
    example:
      - "여백을 충분히 활용 (section_gap >= 100px)"
      - "타이틀에 variable font weight 사용"
      - "호버 시 transform: scale(1.02) 만 사용"
  dont:
    type: list[string]
    example:
      - "skeuomorphic texture 금지"
      - "marquee 자동 스크롤 금지"
      - "12pt 미만 본문 폰트 금지"

# ── Evaluation ──
evaluation:
  score:
    type: float
    range: 0.0~10.0
    description: "총점 (originality + accessibility + responsiveness + trend_relevance)"
  subscores:
    originality:
      type: float
      range: 0.0~10.0
    accessibility:
      type: float
      range: 0.0~10.0
      min_contrast_ratio: 4.5
    responsiveness:
      type: float
      range: 0.0~10.0
  trend_relevance:
    type: string
    enum: [low, medium, high]
    description: "현재 트렌드 부합도"
  reviewed:
    type: bool
    description: "대표님 승인 여부"
  review_date:
    type: string
    format: ISO 8601

# ── ComponentCard (분해된 단위) ──
component_card:
  description: "StyleCard 가 decompose_to_components() 로 자동 분해한 단위 컴포넌트"
  parent: "StyleCard"
  used_for: "Style Mixing (DesignGraph + StyleMixer)"
  fields:
    - id
    - parent_card_id        # 원본 StyleCard.id
    - category              # 단일 카테고리
    - sub_category          # 예: hero: "일본감성" | "미니멀"
    - tags
    - design_dna            # StyleCard 와 동일 DNA 구조
    - composition
    - guidelines
    - compatible_categories # Style Mixing 호환 카테고리
    - conflicts_with_categories
    - harmony_score         # 0~10
    - evaluation