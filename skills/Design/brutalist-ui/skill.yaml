name: brutalist-ui
category: Design
version: '1.0'
description: 스위스 타이포그래피 프린트와 군사 터미널 미학을 융합한 원시적 기계 인터페이스를 생성한다. 경직된 그리드, 극단적인 타입 스케일
  대비, 실용적 색상, 아날로그 열화 효과. 기밀 해제된 청사진처럼 느껴져야 하는 데이터 중심 대시보드, 포트폴리오, 에디토리얼 사이트용.
priority: medium
capabilities:
- ui_generation
- design_review
knowledge:
- prompts
- examples
- data
- templates
trigger:
- brutalist
- raw design
- anti-design
- brutalism
tags:
- design
- brutalism
- industrial
- terminal
- swiss-typography
graph_compatible:
- self-reflection
- taste-design
- full-output
conflicts_with:
- minimalist-ui
- premium-ui
when_to_use: 인더스트리얼/브루탈리스트 웹사이트, 기술 포트폴리오, 데이터 밀집 인터페이스, 터미널 테마 UI, 해커톤 프로젝트
when_not_to_use: 컨슈머 전자상거래, 친근한 커뮤니티 사이트, 아동 대상 콘텐츠, 법률/의료 정보 사이트
inputs: 콘텐츠 구조, 데이터 밀도 요구사항, 선호 모드 (Swiss Industrial Print 또는 Tactical Telemetry)
outputs: 기계적 정밀성과 고밀도 데이터를 발산하는 산업적 브루탈리스트 웹 인터페이스
constraints: 한 프로젝트에 하나의 시각적 모드만 선택 (Swiss Print 또는 Tactical Telemetry). 그라데이션, 소프트
  그림자, 글래스모피즘 금지. border-radius는 항상 0.
success_criteria: 엄격한 그리드 아키텍처, 극단적 타이포그래피 대비, 실용적 색상 팔레트, 아날로그 열화 효과, 90도 각도만 사용
