name: security
category: System
version: '1.0'
description: 코드 및 시스템의 보안 취약점을 식별하고 차단한다
priority: critical
capabilities:
- security_audit
- vulnerability_scan
- input_validation
knowledge:
- prompts
- examples
- data
- templates
trigger:
- security
- vulnerability
- xss
- injection
- auth
- 보안
tags:
- security
- vulnerability
- port-safety
- input-validation
graph_compatible:
- sherlock-qa
- bill-dev
- self-reflection
when_to_use: 코드 보안 감사, 입력 검증 검토, 인증/인가 체계 점검, 포트 안전성 확인 시
when_not_to_use: UI/UX 디자인, 문서 작성, 일반 기능 구현
inputs: 대상 코드베이스, 환경 설정 파일(.env, config.yaml)
outputs: 보안 취약점 목록, 위험도 평가, 수정 권고사항
constraints: 활성 서버 프로세스 kill 금지, 작업 디렉토리 외부 파일 접근 금지
success_criteria: OWASP Top 10 취약점 없음, 민감 정보 노출 없음, 포트 보호 규칙 준수
