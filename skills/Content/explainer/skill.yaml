name: explainer
label: 코드 설명
category: Content
version: '1.0'
description: 복잡한 코드를 단계별로 명확하게 설명하는 가이드라인을 제공한다
priority: medium
capabilities:
- explanation
- tutorial_creation
knowledge:
- prompts
- examples
- data
- templates
trigger:
- explain
- tutorial
- 설명
- 가이드
tags:
- explanation
- code-review
- walkthrough
- algorithm
graph_compatible:
- auto-documenter
- self-reflection
when_to_use: 코드 리뷰 설명, 온보딩 문서, 알고리즘 해설, 아키텍처 설명 시
when_not_to_use: 코드 작성, 디버깅, UI 디자인
inputs: 설명 대상 코드, 독자 수준(입문/중급/고급), 시스템 컨텍스트
outputs: 단계별 코드 설명, 아키텍처 개요, 알고리즘 시각화
constraints: 실제 동작과 다른 설명 금지, 독자 수준에 맞는 용어 사용
success_criteria: 모든 주요 로직 설명, 알고리즘 단계별 분해, 전체 시스템 내 역할 명시
