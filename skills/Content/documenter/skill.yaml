name: documenter
label: 문서 작성
category: Content
version: '1.0'
description: 코드에 대한 명확하고 체계적인 문서 작성을 위한 가이드라인을 제공한다
priority: medium
capabilities:
- documentation
- technical_writing
knowledge:
- prompts
- examples
- data
- templates
trigger:
- document
- write docs
- 문서 작성
tags:
- documentation
- docstring
- api-docs
- explanation
graph_compatible:
- auto-documenter
- self-reflection
when_to_use: 함수/클래스 docstring 작성, API 문서화, 사용 예제 작성 시
when_not_to_use: 코드 작성, 디버깅, UI 디자인, 보안 감사
inputs: 문서화 대상 코드, 포맷 요구사항(Markdown/JSDoc/XML)
outputs: 완성된 문서, docstring, 사용 예제, 의존성 목록
constraints: 실제 코드와 불일치 금지, 모호한 설명 금지
success_criteria: 모든 public 요소 문서화, 파라미터/리턴값/예외 명시, 사용 예제 포함
