name: ffmpeg-video-editor
label: FFmpeg 영상 편집
category: Content
version: '1.0'
description: ffmpeg를 활용한 영상 편집·인코딩·합성 자동화. 자르기, 합치기, 자막, LUT 컬러그레이딩, 효과음/BGM 삽입, 오버레이,
  트렌지션, 리사이즈, 포맷 변환 등 터미널에서 실행 가능한 모든 영상 작업을 다룬다.
priority: high
capabilities:
- video_editing
- audio_processing
- encoding
knowledge:
- prompts
- examples
- data
- templates
trigger:
- video
- ffmpeg
- encoding
- subtitle
- 자막
- 영상 편집
tags:
- ffmpeg
- video
- audio
- editing
- encoding
- subtitle
- lut
- transition
- overlay
- media
graph_compatible:
- full-output
- self-reflection
- creative-director
- ui-ux-pro
when_to_use: 영상 자르기/합치기, 자막 삽입, BGM/효과음 추가, LUT 적용, 오버레이 합성, 포맷 변환, 리사이즈, 썸네일 추출,
  GIF 생성, 영상 분석(ffprobe), 일괄 처리
when_not_to_use: 실시간 영상 편집 GUI 필요 시, 3D 렌더링, 복잡한 모션 그래픽(After Effects급), AI 영상 생성
inputs: 소스 영상/오디오 파일 경로, 편집 요구사항 (자르기 구간, 자막 텍스트, BGM 파일, LUT 파일 등)
outputs: 편집된 영상 파일, 추출된 프레임/오디오, 변환된 포맷, 분석 리포트
constraints: ffmpeg가 시스템에 설치되어 있어야 함. 복잡한 합성은 filter_complex 사용. 큰 파일은 처리 시간 고려. 원본
  백업 권장.
success_criteria: 출력 영상이 정상 재생, 화질 열화 최소화, 오디오 싱크 일치, 자막 타이밍 정확, 의도한 효과 적용
