name: refactorer
label: 리팩토러
category: Coding
version: '1.0'
description: 가독성, 유지보수성, 성능을 개선하는 리팩토링 가이드라인을 제공한다
priority: high
capabilities:
- code_refactoring
- code_quality
knowledge:
- prompts
- examples
- data
- templates
trigger:
- refactor
- restructure
- 리팩토링
- 코드 정리
tags:
- refactoring
- clean-code
- solid
- performance
graph_requires:
- self-reflection
graph_compatible:
- bill-dev
- sherlock-qa
when_to_use: 레거시 코드 개선, 코드 스멜 제거, SOLID 원칙 적용, 성능 최적화 시
when_not_to_use: 새 기능 구현, UI 디자인, 문서 작성
inputs: 리팩토링 대상 코드, 품질 목표(가독성/성능/패턴)
outputs: 리팩토링된 코드, 변경 사유 설명, 개선 효과 분석
constraints: 기능 변경 금지(동작 동등성 유지), 테스트 없는 리팩토링 금지
success_criteria: SOLID 원칙 준수, 코드 중복 제거, 성능 측정치 개선, 가독성 향상
