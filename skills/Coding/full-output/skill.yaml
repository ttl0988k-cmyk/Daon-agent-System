name: full-output
label: 완전 출력
category: Coding
version: '1.0'
description: LLM의 기본 출력 축약 동작을 오버라이드한다. 완전한 코드 생성을 강제하고, 플레이스홀더 패턴을 금지하며, 토큰 제한 분할을
  깔끔하게 처리한다.
priority: high
capabilities:
- complete_implementation
- code_generation
knowledge:
- prompts
- examples
- data
- templates
trigger:
- full output
- complete code
- 전체 코드
- 완성본
tags:
- output
- completeness
- anti-truncation
- quality
graph_compatible:
- self-reflection
- taste-design
- sherlock-qa
when_to_use: 완전하고 축약되지 않은 출력이 필요한 모든 작업, 전체 파일 생성, 다중 컴포넌트 구현
when_not_to_use: 단순 질의응답, 실시간 대화, 짧은 설명 요청
inputs: 사용자 요청, 예상 결과물 개수
outputs: 중간 생략 없는 완전한 출력
constraints: 금지된 패턴이 출력에 나타나면 안 됨. 모든 요청 항목이 완전히 구현되어야 함.
success_criteria: 금지 패턴 없음, 모든 요청 항목 완료, 코드 블록이 실제 실행 가능한 코드 포함, 공간 절약을 위한 축약 없음
