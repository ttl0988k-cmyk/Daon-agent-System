name: harness-worker
version: 0.6.0
description: "Run Codex CLI or Claude Code as an external coding worker. provider='auto' runs an automatic fallback chain (chatgpt subscription -> openrouter -> opencode-go -> minimax): when one brain exhausts its quota the worker switches to the next automatically and cools the exhausted provider down. Use 'chain' to reorder and 'models' to give each provider its own model. Explicit providers: openrouter / chatgpt / opencode-go / qwen-token-plan / minimax / omniroute. Codex uses a per-provider temporary CODEX_HOME; Claude Code routes through a LiteLLM gateway that exposes every provider as an alias."
author: DAON
tools:
  - name: dispatch_worker
    description: "Spawn an external coding harness (Codex CLI or Claude Code) as a non-blocking background worker."
  - name: worker_job
    description: "Query status, list, or terminate background worker jobs."
  - name: worker_status
    description: "Report readiness of Codex / Claude Code / the gateway / providers, plus the auto-fallback chain and quota cooldowns."
  - name: worker_gateway
    description: "Start or stop the LiteLLM gateway required by Claude Code."
